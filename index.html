<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniScribe — 13-Mode Writing Studio</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --bg-editor: #0b1120;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --border: #334155;
      --editor-font: 'Georgia', serif;
      --editor-align: left;
    }

    body.theme-paper {
      --bg-main: #f4ecd8;
      --bg-panel: #eae0c8;
      --bg-editor: #fdfaf2;
      --text-main: #2c221e;
      --text-muted: #6e5a4f;
      --accent: #b45309;
      --accent-soft: rgba(180, 83, 9, 0.12);
      --border: #d6c7b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s, color 0.25s;
    }

    /* Top Header */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    button {
      background: var(--bg-editor);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    button.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Mode Selector Bar (Scrollable on Mobile) */
    .mode-bar {
      display: flex;
      overflow-x: auto;
      gap: 0.4rem;
      padding: 0.55rem 1rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .mode-bar::-webkit-scrollbar {
      display: none;
    }

    .mode-pill {
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-editor);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .mode-pill.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Workspace Container */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 0.75rem;
      gap: 0.6rem;
      overflow: hidden;
    }

    /* Mode Info & Template Banner */
    .mode-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .mode-info h2 {
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .mode-info p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* Smart Insert Toolbar */
    .smart-toolbar {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .smart-toolbar::-webkit-scrollbar {
      display: none;
    }

    .tool-btn {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--text-main);
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-weight: 500;
    }

    /* Title Input & Editor */
    .doc-title {
      width: 100%;
      background: var(--bg-editor);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 0.9rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      outline: none;
      flex-shrink: 0;
    }

    .doc-title:focus, .editor:focus {
      border-color: var(--accent);
    }

    .editor {
      flex: 1;
      width: 100%;
      background: var(--bg-editor);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem;
      font-family: var(--editor-font);
      text-align: var(--editor-align);
      font-size: 1.02rem;
      line-height: 1.75;
      resize: none;
      outline: none;
      overflow-y: auto;
    }

    /* Footer Status Bar */
    footer {
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 0.45rem 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .stats {
      display: flex;
      gap: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">✍️ Omni<span>Scribe</span></div>
    <div class="header-actions">
      <button onclick="toggleTheme()" id="themeBtn">📜 Paper Mode</button>
      <button onclick="clearEditor()">🗑️ Clear</button>
      <button class="primary" onclick="downloadFile()">⬇️ Export .txt</button>
    </div>
  </header>

  <!-- 13 Modes Scroll Bar -->
  <nav class="mode-bar" id="modeBar"></nav>

  <!-- Main Writing Studio -->
  <main class="workspace">
    <div class="mode-header">
      <div class="mode-info">
        <h2 id="modeTitle">Loading...</h2>
        <p id="modeDesc"></p>
      </div>
      <button onclick="loadTemplate()">✨ Load Starter Template</button>
    </div>

    <!-- Mode-Specific Quick Insert Buttons -->
    <div class="smart-toolbar" id="smartToolbar"></div>

    <input type="text" id="docTitle" class="doc-title" placeholder="Enter your title here..." oninput="saveProgress()" />
    
    <textarea id="editor" class="editor" placeholder="Start writing..." oninput="handleInput()"></textarea>
  </main>

  <footer>
    <div class="stats">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 chars</span>
      <span id="lineCount">0 lines</span>
      <span id="readTime">0 min read</span>
    </div>
    <div id="saveStatus">Auto-saved</div>
  </footer>

  <script>
    const MODES = {
      movie: {

        desc: "Screenplay format with scene headings, character cues & transitions.",

        align: "left",
        placeholder: "FADE IN:\n\nINT. COFFEE SHOP - NIGHT\n\n...",
        tools: [

          { label: "+ EXT. SCENE", text: "\nEXT. LOCATION - NIGHT\n\n" },
          { label: "+ CHARACTER", text: "\n\t\t\tCHARACTER NAME\n" },
          { label: "+ (Parenthetical)", text: "\t\t(whispering)\n" },
          { label: "+ CUT TO:", text: "\n\t\t\t\t\t\tCUT TO:\n\n" }
        ],
        template: "FADE IN:\n\nINT. STUDIO APARTMENT - NIGHT\n\nRain lashes against the glass. A single desk lamp illuminates an old notebook.\n\n\t\t\tARJUN\n\t\t(quietly)\n\tEvery story starts before page one.\n\n\t\t\t\t\t\tCUT TO:\n\nEXT. CITY STREET - CONTINUOUS\n\n"
      },

        desc: "High-retention hooks, value bullets, and CTAs for social & digital media.",
        font: "system-ui, sans-serif",
        align: "left",
        placeholder: "Write a scroll-stopping hook...",
        tools: [
          { label: "🔥 Hook", text: "🔥 HOOK: \n\n" },
          { label: "💡 Key Point", text: "• 💡 " },
          { label: "📊 Proof/Stat", text: "\n📌 Fact/Proof: " },
          { label: "👉 CTA", text: "\n\n👉 Call to Action: " },
          { label: "#️⃣ Hashtags", text: "\n\n#content #writing #growth" }
        ],
        template: "🔥 HOOK: 90% of people struggle with consistency because they focus on outcome instead of system.\n\nHere is the 3-step fix:\n• 💡 Step 1: Simplify the trigger\n• 💡 Step 2: Track the minimum viable effort\n• 💡 Step 3: Review weekly\n\n👉 Call to Action: Save this post for your next planning session!\n\n#productivity #mindset #creators"
      },
      story: {
        name: "📖 Story Writing",
        desc: "Fiction & short story studio with narrative pacing and scene breaks.",
        font: "'Georgia', serif",
        align: "left",
        placeholder: "Once upon a quiet evening...",
        tools: [
          { label: "+ Chapter", text: "\n\n# CHAPTER \n\n" },

        placeholder: "Let your verses flow...",
        tools: [
          { label: "+ New Stanza", text: "\n\n" },
          { label: "+ Couplet Divider", text: "\n— ✦ —\n" },
          { label: "+ Refrain", text: "\n[Refrain]\n" },

        ],
        template: "Beneath the amber lantern light,\nWhere shadows weave the quiet night,\n\n— ✦ —\n\nA thousand unspoken words remain,\nLike petrichor after summer rain."
      },
      play: {
        name: "🎭 Playwriting",
        desc: "Stage drama formatting with acts, scenes, and stage directions.",
        font: "'Courier New', monospace",
        align: "left",
        placeholder: "ACT I\nSCENE 1...",
        tools: [
          { label: "+ ACT", text: "\nACT I\n\n" },
          { label: "+ SCENE", text: "\nSCENE 1\n" },

        desc: "Sacred verses, stotras, scripture commentary & sculpture iconography notes.",
        font: "'Georgia', serif",
        align: "center",
        placeholder: "॥ श्री गणेशाय नमः ॥\nWrite devotional hymns, scripture notes, or temple sculpture descriptions...",

          { label: "॥ Shloka / Verse ॥", text: "\n॥ 1 ॥\n" },
          { label: "🕉️ Mangalacharan", text: "॥ ॐ ॥\n\n" },
          { label: "📖 Meaning (Bhashya)", text: "\n\n[Meaning / Commentary]:\n" },
          { label: "🗿 Sculpture / Iconography", text: "\n\n[Sculpture Form / Mudra / Symbolism]:\n" },
          { label: "🙏 Prarthana", text: "\n\n[Prayer / Dedication]:\n" }
        ],
        template: "॥ ॐ ॥\n\n[Deity / Subject]: \n\n[Verse / Stotra]:\n\n॥ 1 ॥\n\n[Sculpture Form / Mudra / Symbolism]:\n• Posture (Asana/Bhanga): \n• Attributes (Ayudha/Mudra): \n• Spiritual Significance: \n\n[Meaning / Commentary]:\n"
      },
      daily: {
        name: "📔 Daily Day Writing",
        desc: "Personal daily journal for reflection, mood tracking, and gratitude.",
        font: "system-ui, sans-serif",
        align: "left",
        placeholder: "How was your day today?",
        tools: [
          { label: "📅 Today's Date", action: "insertDate" },
          { label: "😊 Mood", text: "\nMood: 😊 Peaceful | Energy: 8/10\n" },
          { label: "🙏 3 Gratitudes", text: "\n🙏 Grateful For:\n1. \n2. \n3. \n" },
          { label: "🏆 Daily Win", text: "\n🏆 Best Moment Today:\n" },
          { label: "🌅 Tomorrow", text: "\n🌅 One Priority for Tomorrow:\n" }
        ],
        template: `📅 Date: ${new Date().toLocaleDateString()}\nMood: 😊 Focused | Energy: 8/10\n\n🏆 Best Moment Today:\n\n🙏 Grateful For:\n1. \n2. \n3. \n\n💭 Evening Reflection:\n`
      },
      plan: {
        name: "🗺️ Plan Writing",
        desc: "Structured goal setting, project roadmaps, and actionable checklists.",
        font: "system-ui, sans-serif",
        align: "left",
        placeholder: "Define your objective and action steps...",
        tools: [
          { label: "🎯 Main Goal", text: "\n🎯 OBJECTIVE: \n" },
          { label: "☐ To-Do Item", text: "\n☐ " },
          { label: "☑ Done Item", text: "\n☑ " },
          { label: "⏳ Milestone", text: "\n⏳ Milestone & Deadline: " },
          { label: "⚠️ Bottleneck", text: "\n⚠️ Risk & Solution: " }
        ],
        template: "🎯 OBJECTIVE: \n\n⏳ Timeline / Deadline: \n\n📋 ACTION STEPS:\n☐ Phase 1: \n☐ Phase 2: \n☐ Phase 3: \n\n⚠️ Potential Obstacles & Solutions:\n• "
      },
      history: {
        name: "🏛️ History Writing",
        desc: "Chronicles, timelines, cause-and-effect analysis, and historical records.",
        font: "'Georgia', serif",
        align: "left",
        placeholder: "Document historical eras, battles, cultural shifts, and sources...",
        tools: [
          { label: "🏛️ Era / Dynasty", text: "\n🏛️ Era / Period: " },
          { label: "📅 Date / Year", text: "\n📅 Year: " },
          { label: "📍 Location", text: "\n📍 Key Region/Site: " },
          { label: "⚔️ Cause & Impact", text: "\n\n⚔️ Causes & Historical Impact:\n• " },
          { label: "📜 Source/Inscription", text: "\n📜 Primary Source / Archaeological Evidence: " }
        ],
        template: "🏛️ Era / Period: \n📅 Year / Century: \n📍 Key Region: \n\n📖 Historical Narrative:\n\n⚔️ Causes & Long-Term Impact:\n• Cause: \n• Consequence: \n\n📜 Primary Source / Evidence:\n"
      },
      study: {
        name: "🎓 Study Writing",
        desc: "Cornell-inspired revision notes, formulas, exam cues, and summaries.",
        font: "system-ui, sans-serif",
        align: "left",
        placeholder: "Take structured study notes for fast revision...",
        tools: [
          { label: "📌 Core Topic", text: "\n📌 TOPIC: \n" },
          { label: "❓ Exam Question/Cue", text: "\n❓ Cue / Question: " },
          { label: "💡 Formula / Rule", text: "\n💡 Key Formula / Principle: " },
          { label: "🧠 Mnemonic/Trick", text: "\n🧠 Memory Trick: " },
          { label: "📝 Quick Summary", text: "\n\n📝 3-Line Summary:\n" }
        ],
        template: "📌 TOPIC / CHAPTER: \n\n❓ Key Questions / Exam Cues:\n• \n\n📖 Detailed Notes:\n• \n• \n\n💡 Important Formulas / Dates / Definitions:\n• \n\n📝 Quick Summary:\n"
      },
      biopic: {
        name: "🪞 Self-Biopic Writing",
        desc: "Autobiography and personal memoir studio to capture your life's story.",
        font: "'Georgia', serif",
        align: "left",
        placeholder: "Every life is a legend. Record your chapters...",
        tools: [
          { label: "🌱 Life Era", text: "\n🌱 Era / Age: \n" },
          { label: "📍 Setting the Scene", text: "\n📍 Where I Was: " },
          { label: "🔄 Turning Point", text: "\n\n🔄 The Turning Point:\n" },
          { label: "👥 Key People", text: "\n👥 People Who Shaped This Moment: " },
          { label: "💭 Wisdom Gained", text: "\n\n💭 Looking Back (What It Taught Me):\n" }
        ],
        template: "🌱 Life Chapter / Era: \n📍 Place & Year: \n\n📖 The Memory:\n\n🔄 The Turning Point:\n\n💭 Looking Back (What This Chapter Taught Me):\n"
      },
      research: {
        name: "🔬 Research Writing",
        desc: "Academic papers, literature reviews, methodology, and citations.",
        font: "'Georgia', serif",
        align: "left",
        placeholder: "Structure your abstract, hypothesis, methodology, and references...",
        tools: [
          { label: "+ Abstract", text: "\n## ABSTRACT\n" },
          { label: "+ Introduction", text: "\n## 1. INTRODUCTION & HYPOTHESIS\n" },
          { label: "+ Methodology", text: "\n## 2. METHODOLOGY\n" },
          { label: "+ [Citation]", text: " (Author, Year) " },
          { label: "+ References", text: "\n## REFERENCES\n1. " }
        ],
        template: "## TITLE OF RESEARCH\n\n## ABSTRACT\nObjective, methods, and primary findings in 150 words...\n\n## 1. INTRODUCTION & HYPOTHESIS\n\n## 2. METHODOLOGY\n\n## 3. RESULTS & DISCUSSION\n\n## REFERENCES\n1. "
      },
      news: {
        name: "📰 News or Blog Writing",
        desc: "Journalistic articles and SEO blog posts using the inverted pyramid.",
        font: "system-ui, sans-serif",
        align: "left",
        placeholder: "Write a compelling headline and lead paragraph...",
        tools: [
          { label: "📰 Headline", text: "# HEADLINE: \n\n" },
          { label: "📍 Dateline", text: "CITY, Date — " },
          { label: "🗣️ Quote Block", text: '\n\n> "Insert quote here," said [Source].\n\n' },
          { label: "📑 Subheading (H2)", text: "\n## Subheading\n" },
          { label: "✅ Key Takeaways", text: "\n### Key Takeaways:\n• \n" }
        ],
        template: "# HEADLINE: \n\n### Key Takeaways:\n• \n• \n\nCITY, Date — [Lead Paragraph: Who, what, when, where, and why in 2 punchy sentences.]\n\n## The Background\n\n> \"Direct quote from an expert or witness,\" said Name, Title.\n\n## What Happens Next\n"
      }
    };

    let currentMode = "movie";
    const modeBar = document.getElementById("modeBar");
    const modeTitle = document.getElementById("modeTitle");
    const modeDesc = document.getElementById("modeDesc");
    const smartToolbar = document.getElementById("smartToolbar");
    const editor = document.getElementById("editor");
    const docTitle = document.getElementById("docTitle");

    // Initialize App
    function init() {
      Object.keys(MODES).forEach(key => {
        const btn = document.createElement("button");
        btn.className = `mode-pill ${key === currentMode ? 'active' : ''}`;
        btn.id = `pill-${key}`;
        btn.textContent = MODES[key].name;
        btn.onclick = () => switchMode(key);
        modeBar.appendChild(btn);
      });
      switchMode(currentMode);
    }

    // Switch Writing Mode
    function switchMode(modeKey) {
      currentMode = modeKey;
      const mode = MODES[modeKey];

      // Update active pill
      document.querySelectorAll(".mode-pill").forEach(el => el.classList.remove("active"));
      document.getElementById(`pill-${modeKey}`).classList.add("active");

      // Update headers & styles
      modeTitle.textContent = mode.name;
      modeDesc.textContent = mode.desc;
      document.documentElement.style.setProperty("--editor-font", mode.font);
      document.documentElement.style.setProperty("--editor-align", mode.align);
      editor.placeholder = mode.placeholder;

      // Render mode-specific smart toolbar
      smartToolbar.innerHTML = "";
      mode.tools.forEach(tool => {
        const b = document.createElement("button");
        b.className = "tool-btn";
        b.textContent = tool.label;
        b.onclick = () => {
          if (tool.action === "insertDate") {
            insertAtCursor(`\n📅 ${new Date().toLocaleString()}\n`);
          } else if (tool.action === "toggleAlign") {
            const current = getComputedStyle(document.documentElement).getPropertyValue("--editor-align").trim();
            document.documentElement.style.setProperty("--editor-align", current === "center" ? "left" : "center");
          } else {
            insertAtCursor(tool.text);
          }
        };
        smartToolbar.appendChild(b);
      });

      // Load saved content for this specific mode
      const savedData = JSON.parse(localStorage.getItem(`omniscribe_${modeKey}`) || "{}");
      docTitle.value = savedData.title || "";
      editor.value = savedData.content || "";
      updateStats();
    }

    // Insert snippet at cursor position
    function insertAtCursor(snippet) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const text = editor.value;
      editor.value = text.substring(0, start) + snippet + text.substring(end);
      editor.selectionStart = editor.selectionEnd = start + snippet.length;
      editor.focus();
      handleInput();
    }

    // Load starter template
    function loadTemplate() {
      if (editor.value.trim() !== "" && !confirm("Replace current text with the starter template?")) return;
      editor.value = MODES[currentMode].template;
      handleInput();
    }

    // Save & Stats
    function handleInput() {
      updateStats();
      saveProgress();
    }

    function saveProgress() {
      localStorage.setItem(`omniscribe_${currentMode}`, JSON.stringify({
        title: docTitle.value,
        content: editor.value
      }));
      const status = document.getElementById("saveStatus");
      status.textContent = "Saved ✓";
    }

    function updateStats() {
      const text = editor.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = editor.value.length;
      const lines = editor.value ? editor.value.split("\n").length : 0;
      const readMins = Math.ceil(words / 200);

      document.getElementById("wordCount").textContent = `${words} words`;
      document.getElementById("charCount").textContent = `${chars} chars`;
      document.getElementById("lineCount").textContent = `${lines} lines`;
      document.getElementById("readTime").textContent = `${readMins} min read`;
    }

    function clearEditor() {
      if (confirm("Clear current document in this mode?")) {
        editor.value = "";
        docTitle.value = "";
        handleInput();
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("theme-paper");
      const isPaper = document.body.classList.contains("theme-paper");
      document.getElementById("themeBtn").textContent = isPaper ? "🌙 Dark Mode" : "📜 Paper Mode";
    }

    function downloadFile() {
      const title = (docTitle.value.trim() || currentMode + "-draft").replace(/[^a-z0-9-_]/gi, "_");
      const blob = new Blob([`${docTitle.value}\n\n${editor.value}`], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.txt`;
      a.click();
    }

    init();
  </script>
</body>
</html>
